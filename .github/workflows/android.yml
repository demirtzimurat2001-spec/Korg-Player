name: Build Korg Player APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        run: unzip -q KorgPlayer_Project.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      -       - name: Build APK
        working-directory: source/KorgPlayerPrototype
        run: gradle --no-daemon :app:assembleDebug --stacktrace
